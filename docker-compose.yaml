---
services:
  issuer:
    build: ./issuer
    image: zerossl-ip-issuer:local
    container_name: issuer
    restart: always
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - ZEROSSL_API_KEY=${ZEROSSL_API_KEY:?请在 .env 中设置 ZEROSSL_API_KEY}
      - CERT_IP=${CERT_IP:-}
      # 输出 ip.crt / ip.key，与 nginx 配置中的路径一致
      - CERT_NAME=ip
      - CERT_VALIDITY_DAYS=${CERT_VALIDITY_DAYS:-90}
      - RENEW_BEFORE_DAYS=${RENEW_BEFORE_DAYS:-30}
      - CHECK_INTERVAL_HOURS=${CHECK_INTERVAL_HOURS:-12}
      - FORCE_ISSUE=${FORCE_ISSUE:-0}
      # standalone：issuer 自己在 80 上应答验证请求。
      # 不依赖 nginx，避免「nginx 缺证书起不来 → 无法验证 → 永远拿不到证书」的死锁。
      - VERIFY_MODE=standalone
      - VERIFY_PORT=80
      # 证书换新后直接通知 nginx 容器重载
      - NGINX_CONTAINER=nginx
    volumes:
      - "./nginx/cert:/certs"
      - "./issuer/state:/state"
      - "/var/run/docker.sock:/var/run/docker.sock"

  # human-gate：人机验证闸门 + 访客数据上报中心。
  # host 网络，监听 127.0.0.1:9200，供 nginx 的 auth_request 调用。
  human-gate:
    image: alpine:3.20
    container_name: human-gate
    restart: always
    network_mode: host
    command: ["/human-gate"]
    environment:
      - TZ=Asia/Shanghai
      - GATE_LISTEN=127.0.0.1:9200
      - GATE_COOKIE=hg_pass
      - GATE_SECRET_FILE=/data/secret.key
      - GATE_PASS_TTL_HOURS=${GATE_PASS_TTL_HOURS:-12}
      # 滑块总开关：on=开启验证(默认)，off=纯反代不弹滑块(如反代API)。仍会采集访客数据
      - GATE_ENABLE=${GATE_ENABLE:-on}
      # 上报到中心（在 .env 填写）
      - GATE_REPORT_URL=${GATE_REPORT_URL:?请在 .env 设置中心 ingest 地址}
      - GATE_REPORT_TOKEN=${GATE_REPORT_TOKEN:?请在 .env 设置上报密钥}
      - GATE_REPORT_INSECURE=${GATE_REPORT_INSECURE:-1}
      # 策略地址默认由 REPORT_URL 自动推导；同步间隔默认60秒
      - GATE_POLICY_URL=${GATE_POLICY_URL:-}
      - GATE_POLICY_INTERVAL_SEC=${GATE_POLICY_INTERVAL_SEC:-60}
    volumes:
      - "./human-gate/human-gate:/human-gate:ro"
      - "./human-gate/data:/data"

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: always
    network_mode: host
    depends_on:
      - issuer
      - human-gate
    entrypoint: ["/bin/sh", "/wait-cert.sh"]
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - "./nginx/wait-cert.sh:/wait-cert.sh:ro"
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf"
      - "./nginx/http.d:/etc/nginx/http.d"
      - "./nginx/stream.d:/etc/nginx/stream.d"
      - "./nginx/exconf:/etc/nginx/exconf"
      - "./nginx/log:/var/log/nginx"
      - "./nginx/cert:/etc/nginx/cert"
      - "./www:/var/www/"

# 纯反代场景下不需要 php / mariadb / redis，已移除。
# 原始定义保留在 docker-compose.full.yaml.bak，需要时可取回。
