# 还原访客真实 IP（供 http{} 全局 include）
#
# 作用：本机位于其它代理之后时（CDN、上层反代、负载均衡），
# $remote_addr 会是上一跳代理的地址。启用 real_ip 后，nginx 会
# 用可信代理提交的 X-Forwarded-For 覆盖 $remote_addr，这样
# proxy_set_header X-Real-IP $remote_addr 传给后端的就是访客真实 IP，
# human-gate 滑块与风控分析也能拿到正确来源。
#
# 安全要点：只能信任受控的前置代理网段。
# 绝不要写 set_real_ip_from 0.0.0.0/0 —— 那等于允许任何客户端
# 自带 X-Forwarded-For 伪造来源 IP，绕过风控与封禁。
#
# 直接暴露在公网、前面没有任何代理的节点：保留下面默认值即可，
# 不会有任何行为变化（公网客户端不在可信列表内，$remote_addr 不被覆盖）。

# 回环与容器/内网网段（同机 human-gate、docker 网络、内网 LB）
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

# 如果本节点位于 Cloudflare 之后，取消下面注释（或改成自己的 CDN 段）：
# include /etc/nginx/exconf/realip-cloudflare.conf;

# 取最后一个可信代理传入的地址；配合 real_ip_recursive 逐级回溯，
# 跳过所有可信代理，得到最靠前的真实客户端地址。
real_ip_header    X-Forwarded-For;
real_ip_recursive on;
