server {
    listen 11186 ssl default_server;
    http2 on;
    ssl_certificate /etc/nginx/cert/ip.crt;
    ssl_certificate_key /etc/nginx/cert/ip.key;

    underscores_in_headers on;

    # 497: 明文 HTTP 打到 SSL 端口，跳转到同端口的 https
    error_page 497 https://$host:$server_port$request_uri;

    set $upstream "https://api.example.com";
    # 传给上游的 Host。反代到域名时必须填上游域名，
    # 否则上游的路由、cookie domain、重定向地址都会出错。
    set $upstream_host "api.example.com";

    location / {
        resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;

        proxy_pass $upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name $upstream_host;

        proxy_http_version 1.1;
        proxy_set_header Host $upstream_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering on;
        proxy_buffer_size 256k;
        proxy_buffers 4 1024k;
        proxy_busy_buffers_size 2048k;

        proxy_intercept_errors on;
    }
}
